{% extends "Motores/base.html" %}
{% block title %}Crear Usuario{% endblock %}
{% block header %}Crear Usuario{% endblock %}
{% block content %}
<div class="card-hg p-3" style="max-width: 520px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-hg-blue">Crear Usuario</button>
            <a href="{% url 'cuentas:lista_usuarios' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
